<!DOCTYPE html>
<html>

<head lang="en">
    <title>Mixer Slot Settings</title>
    <meta charset="utf-8" />
    <style>
        :root {
            color-scheme: dark;
            font-family: Segoe UI, sans-serif;
        }

        body {
            margin: 0;
            padding: 16px;
            background: #10151d;
            color: #d8dee9;
        }

        form {
            display: grid;
            gap: 12px;
        }

        label {
            display: grid;
            gap: 6px;
            font-size: 12px;
            color: #9fb0c3;
        }

        input,
        select,
        button {
            font: inherit;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #304153;
            border-radius: 8px;
            background: #17212b;
            color: #eef3f7;
            box-sizing: border-box;
        }

        input[type="range"] {
            width: 100%;
        }

        .range-row {
            display: grid;
            gap: 8px;
            grid-template-columns: 1fr 72px;
            align-items: center;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 9px 12px;
            background: #2e7dd7;
            color: white;
            cursor: pointer;
        }

        .panel {
            margin-top: 16px;
            padding: 12px;
            border: 1px solid #243240;
            border-radius: 10px;
            background: #121a23;
        }

        .meta {
            font-size: 12px;
            color: #8fa0b2;
            margin-bottom: 10px;
        }

        .status {
            min-height: 18px;
            font-size: 12px;
            color: #f2c879;
            margin-bottom: 8px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 8px;
            max-height: 260px;
            overflow: auto;
        }

        li {
            padding: 8px 10px;
            border-radius: 8px;
            background: #18222d;
            border: 1px solid transparent;
        }

        li.current {
            border-color: #2e7dd7;
            background: #13283f;
        }

        .session-name {
            font-size: 13px;
            color: #eef3f7;
        }

        .session-meta {
            font-size: 11px;
            color: #8fa0b2;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <form id="settings-form">
        <label>
            <span>Slot Index</span>
            <div class="range-row">
                <input id="slotIndexRange" type="range" min="0" max="7" step="1" value="0" />
                <input id="slotIndexNumber" type="number" min="0" max="7" step="1" value="0" />
            </div>
        </label>

        <label>
            <span>Show Apps</span>
            <select id="showApps">
                <option value="all">All Sessions</option>
                <option value="active">Active Only</option>
            </select>
        </label>

        <label>
            <span>Step Size</span>
            <div class="range-row">
                <input id="stepSizeRange" type="range" min="1" max="25" step="1" value="5" />
                <input id="stepSizeNumber" type="number" min="1" max="25" step="1" value="5" />
            </div>
        </label>

        <button id="refreshPreview" type="button">Refresh Preview</button>
    </form>

    <section class="panel">
        <div id="previewMeta" class="meta">Loading session preview...</div>
        <div id="previewStatus" class="status"></div>
        <ul id="sessionPreview"></ul>
    </section>

    <script src="mixer-slot.js"></script>
</body>

</html>

<!DOCTYPE html>
<html>

<head lang="en">
    <title>Mixer Slot Settings</title>
    <meta charset="utf-8" />
    <style>
        :root {
            color-scheme: dark;
            font-family: Segoe UI, sans-serif;
        }

        body {
            margin: 0;
            padding: 16px;
            background: #10151d;
            color: #d8dee9;
        }

        form {
            display: grid;
            gap: 12px;
        }

        label {
            display: grid;
            gap: 6px;
            font-size: 12px;
            color: #9fb0c3;
        }

        input,
        select,
        button {
            font: inherit;
        }

        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #304153;
            border-radius: 8px;
            background: #17212b;
            color: #eef3f7;
            box-sizing: border-box;
        }

        textarea {
			min-height: 92px;
			resize: vertical;
		}

        input[type="range"] {
            width: 100%;
        }

        .range-row {
            display: grid;
            gap: 8px;
            grid-template-columns: 1fr 72px;
            align-items: center;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 9px 12px;
            background: #2e7dd7;
            color: white;
            cursor: pointer;
        }

    </style>
</head>

<body>
    <form id="settings-form">
        <label>
            <span>Step Size</span>
            <div class="range-row">
                <input id="stepSizeRange" type="range" min="1" max="25" step="1" value="5" />
                <input id="stepSizeNumber" type="number" min="1" max="25" step="1" value="5" />
            </div>
        </label>

        <label>
            <span>Priority List</span>
            <textarea id="priorityMatchers" rows="5" placeholder="discord&#10;chrome&#10;spotify"></textarea>
        </label>
    </form>

    <script src="mixer-slot.js"></script>
</body>

</html>

<!DOCTYPE html>
<html>

<head lang="en">
    <title>Mixer Slot Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Slot Index">
        <sdpi-range setting="slotIndex" min="0" max="7" step="1" default="0" showlabels></sdpi-range>
    </sdpi-item>
    <sdpi-item label="Show Apps">
        <sdpi-select setting="showApps" default="all">
            <option value="all">All Sessions</option>
            <option value="active">Active Only</option>
        </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Step Size">
        <sdpi-range setting="stepSize" min="1" max="25" step="1" default="5" showlabels></sdpi-range>
    </sdpi-item>
</body>

</html>
